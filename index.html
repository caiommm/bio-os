<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioOS 98 v2.0 — Enciclopédia Interativa de Biologia</title>
  
  <!-- Fontes Retrô e Leitura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            vt: ['"VT323"', 'monospace'],
            mono: ['"Space Mono"', 'monospace'],
            sans: ['"Inter"', 'sans-serif'],
          },
          colors: {
            retroBg: '#008080',
            retroWin: '#C0C0C0',
            retroPaper: '#F4F1EA',
            retroBlue: '#000080',
            retroTeal: '#00A896',
            retroAmber: '#FFB703',
            retroCoral: '#FB5607',
            retroLime: '#8AC926',
          },
          boxShadow: {
            retro: '4px 4px 0px #000000',
            retroSm: '2px 2px 0px #000000',
            winBevel: 'inset 2px 2px 0px #ffffff, inset -2px -2px 0px #808080',
            winInset: 'inset 2px 2px 0px #808080, inset -2px -2px 0px #ffffff',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-retroBg min-h-screen p-2 sm:p-4 md:p-6 font-sans text-black select-none overflow-x-hidden">

  <!-- Janela Principal do Sistema -->
  <div class="max-w-7xl mx-auto bg-retroWin border-2 border-black shadow-retro flex flex-col min-h-[92vh] overflow-hidden">
    
    <!-- Barra de Título estilo Windows 98 -->
    <header class="bg-gradient-to-r from-retroBlue to-[#1084d0] text-white px-2.5 sm:px-3 py-2 flex items-center justify-between gap-2 border-b-2 border-black">
      <div class="flex items-center gap-2 min-w-0">
        <span class="bg-retroLime text-black font-pixel text-[9px] sm:text-[10px] px-1.5 sm:px-2 py-1 border border-black shrink-0">BIO</span>
        <h1 class="font-pixel text-[10px] sm:text-xs md:text-sm tracking-wider truncate">BioOS_98_v2.exe — Biologia</h1>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span id="badge-counter" class="bg-retroAmber text-black font-mono text-[10px] sm:text-xs font-bold px-2 py-0.5 border border-black shadow-retroSm whitespace-nowrap">
          🏆 0/8
        </span>
        <div class="hidden md:flex gap-1">
          <span class="w-5 h-5 bg-retroWin text-black font-bold text-xs flex items-center justify-center border border-black shadow-winBevel">_</span>
          <span class="w-5 h-5 bg-retroWin text-black font-bold text-xs flex items-center justify-center border border-black shadow-winBevel">□</span>
          <span class="w-5 h-5 bg-retroCoral text-white font-bold text-xs flex items-center justify-center border border-black shadow-winBevel">X</span>
        </div>
      </div>
    </header>

    <!-- Barra de Status / Submenu -->
    <div class="bg-retroWin px-2.5 sm:px-3 py-1.5 border-b-2 border-black flex flex-wrap items-center justify-between gap-2 text-[11px] sm:text-xs font-mono">
      <div class="hidden sm:flex gap-4">
        <span><u>A</u>rquivo</span>
        <span><u>E</u>xibir</span>
        <span><u>L</u>aboratório</span>
        <span><u>R</u>eferências</span>
      </div>
      <div class="flex items-center gap-2 min-w-0">
        <span class="w-2.5 h-2.5 rounded-full bg-green-500 border border-black animate-pulse shrink-0"></span>
        <span id="status-bar" class="truncate">Sistema pronto. Selecione um módulo de estudo.</span>
      </div>
    </div>

    <!-- Corpo Principal: Sidebar + Área de Conteúdo -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-w-0">
      
      <!-- Menu Lateral de Navegação -->
      <aside class="lg:col-span-3 bg-retroWin p-2.5 sm:p-3 border-b-2 lg:border-b-0 lg:border-r-2 border-black flex flex-col justify-between gap-3 lg:gap-4 min-w-0">
        <div class="min-w-0">
          <div class="font-pixel text-[9px] sm:text-[10px] bg-black text-retroLime px-2 py-1.5 mb-2">
            DISCIPLINAS & MÓDULOS
          </div>
          <!-- Barra horizontal no mobile, grade/coluna no desktop -->
          <nav id="sidebar-menu" class="flex lg:grid lg:grid-cols-1 overflow-x-auto lg:overflow-visible gap-1.5 pb-1.5 lg:pb-0">
            <!-- Botões gerados dinamicamente pelo app.js -->
          </nav>
        </div>

        <!-- Painel de Conquistas (Gamificação) -->
        <div class="bg-retroPaper p-2 sm:p-2.5 border-2 border-black shadow-winInset">
          <h3 class="font-pixel text-[9px] sm:text-[10px] mb-2 text-retroBlue">CONQUISTAS DESBLOQUEADAS</h3>
          <div id="badges-grid" class="grid grid-cols-8 lg:grid-cols-4 gap-1.5 text-center">
            <!-- Medalhas renderizadas via JS -->
          </div>
        </div>
      </aside>

      <!-- Área Principal de Conteúdo -->
      <main id="main-content" class="lg:col-span-9 bg-retroPaper p-3 sm:p-4 md:p-6 overflow-y-auto select-text min-w-0">
        <!-- Conteúdo dinâmico injetado aqui -->
        
      </main>
    </div>

    <!-- Rodapé -->
    <footer class="bg-retroWin border-t-2 border-black px-3 py-1.5 text-[10px] sm:text-xs font-mono flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1.5">
      <span>BioOS 98 © Projeto Educacional Aberto — Alberts, Guyton, Lehninger, Brusca, Raven & Futuyma</span>
      <button onclick="resetProgress()" class="underline hover:text-red-700 shrink-0">Resetar Progresso</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
